<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>해커톤 달력 타임라인</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

    :root {
      --bg1: #f6f9ff;
      --bg2: #eef7f2;
      --card: rgba(255, 255, 255, 0.88);
      --border: #dbe4f0;
      --text: #1f2937;
      --muted: #6b7280;

      --primary: #3b82f6;
      --primary-strong: #2563eb;
      --accent: #10b981;
      --accent-soft: #d1fae5;

      --today-bg: #e0f2fe;
      --today-border: #38bdf8;

      --event-bg: #f8fbff;
      --event-border: #dbeafe;

      --dday-bg: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      --dday-border: #fb7185;
      --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 28%),
        radial-gradient(circle at top right, #dcfce7 0%, transparent 24%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 20px 48px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(59,130,246,0.95), rgba(16,185,129,0.9));
      color: #fff;
      border-radius: 24px;
      padding: 28px 28px 24px;
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.18);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .hero p {
      font-size: 16px;
      opacity: 0.95;
      position: relative;
      z-index: 1;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .meta-chip {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.24);
      backdrop-filter: blur(4px);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 14px;
      font-size: 20px;
      font-weight: 800;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .week div {
      text-align: center;
      padding: 12px 8px;
      font-weight: 800;
      font-size: 14px;
      color: var(--muted);
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(219,228,240,0.9);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(31, 41, 55, 0.04);
    }

    .week div.sun { color: #e11d48; }
    .week div.sat { color: #2563eb; }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      min-height: 148px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .day:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(31, 41, 55, 0.12);
      border-color: #bfd3ea;
    }

    .day.empty {
      background: rgba(255,255,255,0.38);
      border-style: dashed;
      min-height: 148px;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .date {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      white-space: nowrap;
    }

    .event {
      font-size: 12px;
      line-height: 1.5;
      color: #334155;
      background: var(--event-bg);
      border: 1px solid var(--event-border);
      border-radius: 12px;
      padding: 8px 9px;
      word-break: keep-all;
    }

    .today {
      background: linear-gradient(180deg, #f0f9ff 0%, var(--today-bg) 100%);
      border: 2px solid var(--today-border);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.18);
    }

    .today .date {
      color: #0369a1;
    }

    .d-day {
      background: var(--dday-bg);
      border: 2px solid var(--dday-border);
      box-shadow: 0 14px 28px rgba(251, 113, 133, 0.16);
    }

    .d-day .date {
      color: #be123c;
    }

    .d-day .badge {
      background: #fff;
      color: #e11d48;
      border-color: #fda4af;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      margin-top: 22px;
    }

    .info-card,
    .dday-box {
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .info-card h2,
    .dday-box h2 {
      font-size: 20px;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .info-card p,
    .dday-box p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .dday-main {
      margin-top: 14px;
      font-size: 15px;
      color: #334155;
      line-height: 1.7;
    }

    .dday-number {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #dbeafe, #dcfce7);
      color: #0f172a;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .small-note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .calendar,
      .week {
        grid-template-columns: repeat(7, minmax(90px, 1fr));
        overflow-x: auto;
      }

      .bottom-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 28px;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 10px 14px 32px;
      }

      .hero {
        padding: 20px 18px;
      }

      .hero h1 {
        font-size: 10px;
      }

      .meta-chip {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <h1>일동제약 해커톤(Tom, Jerry, Teddy)</h1>

      <div class="hero-meta">
        <div class="meta-chip" id="todayText">📅 오늘: 계산 중...</div>
        <div class="meta-chip" id="hackathonText">🎯 해커톤 본행사: 2026.04.15 ~ 2026.04.16</div>
        <div class="meta-chip" id="remainText">⏳ 남은 기간: 계산 중...</div>
      </div>
    </div>

    <div class="section-title">🗓️ 2026년 3월</div>

    <div class="week">
      <div class="sun">일</div>
      <div>월</div>
      <div>화</div>
      <div>수</div>
      <div>목</div>
      <div>금</div>
      <div class="sat">토</div>
    </div>

    <div class="calendar" id="calendar"></div>


    </div>
  </div>

  <script>
    const year = 2026;
    const month = 2; // 0-based, 2 = 3월
    const hackathonStart = new Date(2026, 3, 15); // 2026-04-15
    const hackathonEnd = new Date(2026, 3, 16);   // 2026-04-16

    const events = {
      9: "📘 파이썬 개념 숙지 및 GUI이해",
      10: "🤖 LLM의 개념 이해 및 파이썬 GUI 제작(tkinter), 정적 사이트웹크롤링",
      11: "🕷️ 동적사이트 웹크롤링(Selenium, Playwright), pyQt 기반의 GUI 생성",
      12: "🎯 웹자동화 기초 학습(이번 해커톤때 안하기로함)",
      13: "📈 API 크롤링(DART, 주식정보)",
      14: "🧪 본격해커톤 준비(pyQt 기반의 시액조제일지 검토프로그램 GUI 생성)",
      16: "🧩 프론트엔드, 백엔드 개념숙지",
      17: "🙌 해커톤 OT",
      18: "🛠️ 미소를 이용하여 프론트엔드 생성",
      20: "✍️ API 레벨업(지피티 API로 블로그 포스팅)",
      24: "🎬 팀소개영상 제작 교육",
      25: "🔗 프론트엔드와 백엔드의 연결"
    };

    const ddayEventDay = 12;

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}.${m}.${d}`;
    }

    function getKoreanWeekday(date) {
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      return days[date.getDay()];
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function diffDays(a, b) {
      const ms = 1000 * 60 * 60 * 24;
      return Math.floor((startOfDay(a) - startOfDay(b)) / ms);
    }

    function getDdayText(targetDate, today) {
      const diff = diffDays(targetDate, today);
      if (diff > 0) return `D-${diff}`;
      if (diff === 0) return "D-Day";
      return `D+${Math.abs(diff)}`;
    }

    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      const today = new Date();

      const firstDay = new Date(year, month, 1);
      const lastDate = new Date(year, month + 1, 0).getDate();
      const startWeekday = firstDay.getDay();

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
      }

      for (let date = 1; date <= lastDate; date++) {
        const cellDate = new Date(year, month, date);
        const isToday =
          today.getFullYear() === year &&
          today.getMonth() === month &&
          today.getDate() === date;

        const isDdayEvent = date === ddayEventDay;

        const day = document.createElement("div");
        day.className = "day";
        if (isToday) day.classList.add("today");
        if (isDdayEvent) day.classList.add("d-day");

        const badgeText = [];
        if (isToday) badgeText.push("오늘");
        if (isDdayEvent) badgeText.push("해커톤 선발");

        day.innerHTML = `
          <div class="day-header">
            <div class="date">${date}</div>
            ${badgeText.length ? `<div class="badge">${badgeText.join(" · ")}</div>` : ""}
          </div>
          ${events[date] ? `<div class="event">${events[date]}</div>` : ""}
        `;

        calendar.appendChild(day);
      }
    }

    function renderDynamicInfo() {
      const today = new Date();

      document.getElementById("todayText").textContent =
        `📅 오늘: ${formatDate(today)} (${getKoreanWeekday(today)}요일)`;

      document.getElementById("hackathonText").textContent =
        `🎯 해커톤 본행사: ${formatDate(hackathonStart)} ~ ${formatDate(hackathonEnd)}`;

      document.getElementById("remainText").textContent =
        `⏳ 남은 기간: ${getDdayText(hackathonStart, today)}`;

      document.getElementById("ddayNumber").textContent =
        getDdayText(hackathonStart, today);

      const startDiff = diffDays(hackathonStart, today);
      const endDiff = diffDays(hackathonEnd, today);

      let detailText = "";


      document.getElementById("ddayDetail").textContent = detailText;
      document.getElementById("ddaySubText").textContent = subText;
    }

    renderCalendar();
    renderDynamicInfo();
  </script>
</body>
</html>
