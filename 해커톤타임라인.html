<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해커톤 타임라인</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #e0f2fe, #dcfce7);
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 16px;
}

.title {
  text-align: center;
  margin-bottom: 20px;
}

.title h1 {
  font-size: 28px;
}

.title p {
  color: #555;
  font-size: 14px;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 8px;
  font-weight: 700;
  text-align: center;
  color: #666;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  min-height: 120px;
  font-size: 12px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

.date {
  font-weight: 800;
  margin-bottom: 4px;
}

.event {
  color: #555;
  line-height: 1.4;
}

.today {
  border: 2px solid #3b82f6;
  background: #e0f2fe;
}

.d-day {
  border: 2px solid #ef4444;
  background: #fee2e2;
}

.dday-box {
  margin-top: 20px;
  text-align: center;
  background: #fff;
  padding: 16px;
  border-radius: 12px;
}

.dday-box b {
  font-size: 22px;
  color: #0a8f5c;
}

/* 🔥 모바일 대응 */
@media (max-width: 600px) {

  .calendar {
    display: flex;
    flex-direction: column;
  }

  .week {
    display: none;
  }

  .day {
    min-height: auto;
    padding: 14px;
  }

  .date {
    font-size: 16px;
  }

  .event {
    font-size: 13px;
  }
}

</style>
</head>

<body>

<div class="wrap">

  <div class="title">
    <h1>🚀 해커톤 타임라인</h1>
    <p id="todayText"></p>
  </div>

  <div class="week">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="dday-box">
    해커톤 (2026.04.15 ~ 04.16)<br>
    <b id="dday"></b>
  </div>

</div>

<script>

const events = {
  9: "📘 파이썬 개념 숙지 및 GUI이해",
  10: "🤖 LLM 이해 + tkinter GUI + 정적 크롤링",
  11: "🕷️ 동적 크롤링 + pyQt GUI",
  12: "🎯 웹자동화 기초",
  13: "📈 API 크롤링",
  14: "🧪 프로그램 GUI 제작",
  16: "🧩 FE/BE 개념",
  17: "🙌 해커톤 OT",
  18: "🛠️ 프론트 생성",
  20: "✍️ GPT API 활용",
  24: "🎬 팀 영상 제작",
  25: "🔗 FE-BE 연결"
};

const today = new Date();
const hackathon = new Date(2026,3,15);

function format(date){
  return `${date.getFullYear()}.${date.getMonth()+1}.${date.getDate()}`;
}

document.getElementById("todayText").innerText =
  `오늘: ${format(today)}`;

const diff = Math.ceil((hackathon - today) / (1000*60*60*24));
document.getElementById("dday").innerText =
  diff > 0 ? `D-${diff}` : "진행중";

const firstDay = new Date(2026,2,1).getDay();
const lastDate = new Date(2026,3,0).getDate();

const cal = document.getElementById("calendar");

for(let i=0;i<firstDay;i++){
  const empty = document.createElement("div");
  cal.appendChild(empty);
}

for(let i=1;i<=lastDate;i++){
  const div = document.createElement("div");
  div.className = "day";

  if(today.getDate()===i && today.getMonth()===2){
    div.classList.add("today");
  }

  if(i===12){
    div.classList.add("d-day");
  }

  div.innerHTML = `
    <div class="date">${i}일</div>
    ${events[i] ? `<div class="event">${events[i]}</div>` : ""}
  `;

  cal.appendChild(div);
}

</script>

</body>
</html>
